services:
  president-app:
    image: orzutraveluser/president_container:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: president-container
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512
      - UV_THREADPOOL_SIZE=2
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - president-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 768M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  president-network:
    driver: bridge
